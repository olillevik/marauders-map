<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marauders Map</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
      #controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      #status {
        margin: 0;
        padding: 4px 8px;
        background: white;
        color: #b00020;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <button id="refresh" type="button">Refresh</button>
      <p id="status" role="status"></p>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
